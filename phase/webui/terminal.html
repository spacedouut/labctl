<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>phase terminal</title><link rel="stylesheet" href="/static/xterm.css"><link rel="stylesheet" href="/static/fonts.css"><style>html,body,#term{height:100%;margin:0;background:#0a0d12}#term{padding:10px;box-sizing:border-box}.xterm{height:100%}</style><div id="term"></div><script src="/static/xterm.js"></script><script src="/static/xterm-addon-fit.js"></script><script>const q=new URLSearchParams(location.search),kind=q.get('kind'),name=q.get('name'),token=localStorage.getItem('phase_token')||'';document.title=`phase · ${kind} ${name}`;const t=new Terminal({cursorBlink:true,fontFamily:'"IBM Plex Mono", ui-monospace, monospace',fontSize:13,theme:{background:'#0a0d12',foreground:'#c9d1d9'},scrollback:4000}),f=new FitAddon.FitAddon();t.loadAddon(f);t.open(document.querySelector('#term'));const proto=location.protocol==='https:'?'wss:':'ws:',path=kind==='host'?'/api/host/terminal':'/api/'+kind+'/'+encodeURIComponent(name),ws=new WebSocket(proto+'//'+location.host+path+(token?'?token='+encodeURIComponent(token):''));function fit(){f.fit();if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'resize',cols:t.cols,rows:t.rows}))}ws.binaryType='arraybuffer';ws.onopen=fit;addEventListener('resize',fit);ws.onmessage=e=>t.write(e.data);ws.onclose=()=>t.write('\r\n\x1b[33m[connection closed]\x1b[0m\r\n');t.onData(d=>ws.readyState===1&&ws.send(new TextEncoder().encode(d)));fit();t.focus();</script></html>
